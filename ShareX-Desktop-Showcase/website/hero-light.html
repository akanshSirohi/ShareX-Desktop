<!doctype html><html lang="en"><meta charset="utf-8"><title>ShareX Desktop · light showcase</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",system-ui,sans-serif}
.stage{position:relative;width:1200px;height:760px;display:grid;place-items:center;overflow:hidden;background:#211d2c}
.stage:before{content:"";position:absolute;inset:0;background:url(assets/hexagons.svg) repeat;opacity:.36;mask-image:radial-gradient(ellipse at 80% 0%,black,transparent 75%)}
.frame{position:relative;width:1072px;overflow:hidden;border:1px solid #ffffff20;border-radius:13px;background:#151519;box-shadow:0 35px 70px #0005,0 2px 8px #0004}
.bar{height:32px;display:flex;align-items:center;padding:0 13px;gap:8px;color:#c0bccb;font-size:10px;background:#1c1b21;border-bottom:1px solid #ffffff0d}
.bar img{width:15px;height:15px;object-fit:contain}.controls{margin-left:auto;display:flex;gap:17px;align-items:center;color:#7f7b88}
.controls i{font-style:normal;font-size:12px}.screen{width:100%;height:auto;display:block}
.light{background:#eeebf4}.light .frame{border-color:#fff;background:#faf9fc;box-shadow:0 35px 70px #4a355326,0 2px 8px #4a35531a}
.light .bar{background:#f5f3f8;border-bottom-color:#ded9e7;color:#534d5e}
</style><main class="stage light"><div class="frame"><div class="bar"><img src="assets/sharex-logo.png" alt="">ShareX Desktop<span class="controls" aria-hidden="true"><i>−</i><i>□</i><i>×</i></span></div><img class="screen" src="../screenshots/09-shared-files-light.png" alt="ShareX Desktop light file workspace"></div></main></html>
